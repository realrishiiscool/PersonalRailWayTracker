services:
  - type: web
    name: personalrailwaytracker-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: APP_ORIGINS
        value: https://realrishiiscool.github.io
      - key: RAILRADAR_API_KEY
        sync: false
